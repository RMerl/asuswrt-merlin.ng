# IMPORTANT - This file should be copied to a new file and your options file should reference the copy
# MSB and boardid values must match the PCB hardware
# Several other values must be customized and/or serialized to your deployment as noted below

MCB=0x40101534
# NAND partitioning will take effect on the initial boot from a bootstrap image
# preprogram the IMAGE variable to reflect either the actual size of NAND to be included 
# in partitioning or a size greater than the largest NAND in use.
# if mtdoops and mtdoops_size are defined on initial boot, space for an mtdoops partition will
# be permanently reserved.
IMAGE=NAND:2M,1024M
mtdoops=crashdump
mtdoops_size=8M
boardid=963146REF1D
nummacaddrs=10
# ethaddr must be serialized to be unique to each device either by the flash programmer or can be done from u-boot
ethaddr=02:10:18:00:00:01
bootcmd=printenv;run once;sdk boot_img
ipaddr=192.168.1.1
bootdelay=5
# The "once" script can be used to enable networking to load and run a script via TFTP during manufacturing
once=sdk metadata 1 1;setenv once true;saveenv
# The default passwords in manufacturing should be set to a unique value for each device
default_support_password=Support!
default_user_password=User!
