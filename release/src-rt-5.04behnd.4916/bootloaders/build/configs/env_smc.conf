# IMPORTANT - This file should be copied to a new file and your options file should reference the copy
# MSB and boardid values must match the PCB hardware
# Several other values must be customized and/or serialized to your deployment as noted below

nummacaddrs=10
# ethaddr must be serialized to be unique to each device either by the flash programmer or can be done from u-boot
ethaddr=02:10:18:00:00:01
bootcmd=printenv;run once;sdk boot_img
ipaddr=192.168.1.1
netmask=255.255.255.0
bootdelay=3
once=sdk vfbio 1boot
# The default passwords in manufacturing should be set to a unique value for each device
default_support_password=Support!
default_user_password=User!
