BRCM_CHIP := 63146
UBOOT_CONFIG = bcm963146_defconfig
STANDALONE_CONFIGS = DDR3 DDR4
STANDALONE_TYPE = dpfe
ARCH = aarch64
SEC_ARCH = GEN3

UBOOT_CROSS_COMPILE = /opt/toolchains/crosstools-aarch64-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/usr/bin/aarch64-linux-

bcm_uboot_envsize = 16384
bcm_uboot_env = env_SPINOR_1M_63146ref.conf
bcm_uboot_layout = loader_1M_SPINOR_saddr34_dpfe_basic.conf
bcm_uboot_image_offset = 1M
bcm_uboot_spl_arch = dpfe spinor
bcm_uboot_spl_prefix = spinor_
bcm_uboot_arch = spinor

bcm_image_compatstr = "rev=a0+;ip=ipv6,ipv4;ddr=ddr3,ddr4"
bcm_uboot_kernel_compression = lzo
bcm_cred_dir = targets/keys/demo/GEN3
bcm_uboot_fit_sign = targets/keys/demo/GEN3/Krot-fld.pem
bcm_uboot_fit_signer = sign_openssl_simple.sh
bcm_spinor_squashfs_offset = 14M

