BRCM_CHIP := 6764
UBOOT_CONFIG = bcm96764_defconfig
STANDALONE_CONFIGS = DDR3 DDR4
STANDALONE_TYPE = dpfe
ARCH = arm
SEC_ARCH = GEN3

UBOOT_CROSS_COMPILE = /opt/toolchains/crosstools-arm_hf-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/usr/bin/arm-buildroot-linux-gnueabihf-

bcm_uboot_envsize = 16384
bcm_uboot_env = env_NAND_2M_6764REF1.conf
bcm_uboot_layout = loader_2M_saddr34lp4_dpfe_sec_tkmfg.conf
bcm_uboot_image_offset = 2M
bcm_uboot_spl_arch = dpfe nand lpae
bcm_uboot_spl_prefix = nand_
bcm_image_compatstr = "rev=a0+;ip=ipv6,ipv4;ddr=ddr3,ddr4"
bcm_uboot_kernel_compression = lzo


bcm_sech_arch_ver = v3
bcm_cred_dir_suffix = targets/keys/demo/GEN3/$(bcm_sech_arch_ver)
bcm_cred_dir = $(bcm_cred_dir_suffix)
bcm_uboot_fit_sign = $(bcm_cred_dir_suffix)/Krot-fld.pem
bcm_uboot_fit_signer = sign_openssl_simple.sh
bcm_uboot_spl_secmode = field
bcm_uboot_spl_sign = $(bcm_cred_dir_suffix)/Krot-fld.pem
bcm_uboot_spl_signer = sign_openssl_simple.sh
bcm_uboot_fit_security = build/configs/security_trust_fit.dtsi

# Build a v3 delegate package first by calling:
# /bootloaders/build/scripts/gen_delg_package_example.sh bootloaders/build/work/delg_package_v3/ v3
bcm_uboot_delg_sec_pol = bootloaders/build/work/delg_package_v3/12345_sec_policy.itb
bcm_uboot_delg_sec_pol_sig = bootloaders/build/work/delg_package_v3/12345_sec_policy.itb.sigv3
bcm_uboot_delg_sec_sdr = bootloaders/build/work/delg_package_v3/12345_sec_sdr.bin
bcm_uboot_delg_sec_sdr_sig = bootloaders/build/work/delg_package_v3/12345_sec_sdr.bin.sigv3
bcm_uboot_delg_fit_sign =  bootloaders/build/work/delg_package_v3/Krsa-delg.pem
bcm_uboot_delg_aes_base = bootloaders/build/work/delg_package_v3/Kaes-delg

bcm_uboot_rootfs_encrypt = encrypt_verity_rootfs.pl
bcm_uboot_encode_keys = IMAGE_KEY:obj/binaries/rootfs_key.bin CMD_KEY:build/configs/key_password_example.bin

bcm_uboot_aes_len = 256
bcm_uboot_spl_encryptor_args = -l $(bcm_uboot_aes_len) 
bcm_uboot_fld_sec_opt = opt<enc version=0x3>
bcm_uboot_spl_encrypt = $(bcm_cred_dir_suffix)/Kroe-fld-ek.bin $(bcm_cred_dir_suffix)/Kroe-fld-iv.bin
bcm_uboot_spl_encryptor = encrypt_openssl_simple.sh
