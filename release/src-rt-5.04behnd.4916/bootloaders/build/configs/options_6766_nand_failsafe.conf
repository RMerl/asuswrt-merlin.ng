BRCM_CHIP := 6766
UBOOT_CONFIG = bcm96766_defconfig
STANDALONE_CONFIGS = DDR3 DDR4 LPDDR4
STANDALONE_TYPE = dpfe
ARCH = arm
SEC_ARCH = GEN3

UBOOT_CROSS_COMPILE = /opt/toolchains/crosstools-arm_hf-gcc-13.2-linux-5.15-glibc-2.38-binutils-2.41/usr/bin/arm-buildroot-linux-gnueabihf-

bcm_uboot_envsize = 16384
bcm_uboot_env = env_NAND_4M_6766REF1.conf
bcm_uboot_layout = loader_4M_saddr34lp4_dpfe_failsafe.conf
bcm_uboot_image_offset = 4M
bcm_uboot_spl_arch = dpfe nand lpae failsafe
bcm_uboot_arch = failsafe
bcm_uboot_spl_prefix = nand_
bcm_uboot_failsafe_dir = targets/loaders/failsafe
bcm_image_compatstr = "rev=a0+;ip=ipv6,ipv4;ddr=ddr3,ddr4,lpddr4"
bcm_uboot_kernel_compression = lzo
bcm_cred_dir = targets/keys/demo/GEN3
bcm_uboot_fit_sign = targets/keys/demo/GEN3/Krot-fld.pem
bcm_uboot_fit_signer = sign_openssl_simple.sh
