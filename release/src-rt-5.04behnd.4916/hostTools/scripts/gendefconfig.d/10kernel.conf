# the kernel .config file available via /proc/config.gz
# and also enable DEBUG_FS
if ( $p->get('BUILD_DEBUG_TOOLS') ) {
	$c->set( 'CONFIG_IKCONFIG',      'y' );
	$c->set( 'CONFIG_IKCONFIG_PROC', 'y' );
	$c->set( 'CONFIG_DEBUG_FS',      'y' );
