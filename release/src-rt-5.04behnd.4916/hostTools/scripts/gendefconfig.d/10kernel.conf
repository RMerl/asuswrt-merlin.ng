	$c->set( 'CONFIG_CMDLINE', $p->get('BCM_KERNEL_CMDLINE') );
	if ( $p->get('BCM_KERNEL_CMDLINE_OVERRIDE') ) {
		$c->set( 'CONFIG_CMDLINE_FORCE', 'y' );
	}
}

$c->set( 'CONFIG_SLUB', 'y' );

