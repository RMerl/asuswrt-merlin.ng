%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/brcm,sdhci-bcmbca.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: BROADCOM BCA MMC Controller

maintainers:
  - Farhan Ali <farhan.ali@broadcom.com>

allOf:
  - $ref: mmc-controller.yaml#

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - brcm,sdhci-bcm63138
              - brcm,sdhci-bcm6813
              - brcm,sdhci-bcm6766

  reg:
    minItems: 4
    items:
      - description: core mmc SDHCI register interface
      - description: toplevel mmc controller config register
      - description: mmc boot controller config registers
      - description: mmc ahb bus config controllers
      - description: Command queuing registers

  reg-names:
    items:
      - const: sdhci-base
      - const: sdhci-topcfg
      - const: sdhci-boot
      - const: sdhci-ahbss-ctrl
      - const: cqhci_mem

  interrupts:
    maxItems: 1

  brcm,sdhci-pll-baseclk-mhz:
    description:
      when present, indicates the input clock frquency to the PLL providing the baseclock to
      the mmc controller. Units are in Mhz and are fixed for each specific Soc
    minimum: 3400
    maximum: 9000

  brcm,sdhci-pll-valid-op-mhz:
    description:
      when present, indicates the range of possible output frequncies of the
      the PLL providing the base clock for the mmc controller. Multiple frequencies
      can be listed in 1Mhz units. These values are fixed for each specific Soc

  clock-frequency:
    description:
      when present, should be the frequency (in Hz) of required baseclock for the mmc controller.
      This value should match one of the values in brcm,sdhci-pll-valid-op-mhz array and is
      determined after benchmarking the most stable clock for a specific board. Should only be
      used if the required baseclock is different from the default supplied clock to mmc controller
    $ref: /schemas/types.yaml#/definitions/uint32

required:
  - compatible
  - reg
  - reg-names
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    sdhci: mmc@20000 {
      compatible = "brcm,sdhci-bcm63138";
      reg-names = "sdhci-base", "sdhci-topcfg", "sdhci-boot", "sdhci-ahbss-ctrl", "cqhci_mem";
      reg = <0x20000 0x100 0x20300 0x200 0x20500 0x40 0x10300 0x100 0x20200 0x100>;
      interrupts = <0x0 0x27 0x4>;
      bus-width = <0x8>;
      brcm,sdhci-pll-baseclk-mhz = <5000>;
      brcm,sdhci-pll-valid-op-mhz = <100 125 156 185 200>;
      sd-uhs-sdr50;
      sd-uhs-sdr104;
      sd-uhs-ddr50;
      mmc-ddr-1_8v;
      mmc-hs200-1_8v;
      clock-frequency = <200000000>;
    };
